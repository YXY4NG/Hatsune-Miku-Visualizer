<html>
  <head>
    <title>After the Curtain — Magical Mirai 2026</title>
    <link rel="stylesheet" href="index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
   <body>
    <div id="sky-day" class="sky"></div>
    <div id="sky-sunset" class="sky"></div>
    <canvas id="bg-canvas"></canvas>
    <div id="vignette"></div>
    <div id="overlay">
      <button class="play" disabled>Play</button>
    </div>
    <div id="container">
      <p id="lyrics"><span id="text"></span></p>
    </div>
    <div id="media"></div>
    <div id="header">
      <div id="meta">
        <div id="artist"><strong>artist</strong> <span>-</span></div>
        <div id="song"><strong>track</strong> <span>-</span></div>
      </div>
    </div>
    <div id="footer">
      <p><span id="position"><strong>-</strong> ms</span></p>
      <div id="control" style="display: none">
        <button class="play" disabled>Play</button>
        <button id="jump" disabled>Jump</button>
        <button id="pause" disabled>Pause</button>
        <button id="rewind" disabled>Rewind</button>
        <input type="range" id="seekbar" min="0" max="100" value="0" disabled />
      </div>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
